<link rel="canonical" href="{{ page.url | absolute_url | escape }}">
{% for variant in variants -%}
<link rel="alternate" hreflang="{{ variant.lang }}" href="{{ variant.url | absolute_url | escape }}">
{% if variant.lang == 'en' -%}
<link rel="alternate" hreflang="x-default" href="{{ variant.url | absolute_url | escape }}">
{% endif -%}
{% endfor -%}
