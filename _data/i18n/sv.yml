  features:
    title: 'Det här ingår'
    items:
    - title: 'C2PA-kontroller och videoursprung'
      body: 'Kontrollera Content Credentials som stöds i foton och videor, även AI-etiketter. Varje export till Bilder får också en ByteWave-stämpel som hjälper till att upptäcka senare ändringar.'
    - title: 'Slowmotion och rörelseoskärpa'
      body: 'Gör slowmotion mjukare med bildruteomvandling. Rörelseoskärpa och tidsbaserad brusreducering bearbetas också på enheten.'
    - title: 'AI-uppskalning'
      body: 'Skala upp upplösningen på din enhet. Ingen molnbehandling och ingen väntan på servrar.'
    - title: 'Obegränsade ljudspår'
      body: 'Lägg så många ljudklipp du vill på tidslinjen. Inbyggda ljudeffekter. Ingen spårgräns.'
    - title: 'Text till tal'
      body: 'Gör text till tal eller skapa undertexter på enheten. Valfria automatiska taggar för delade videor kräver konto och samtycke.'
    - title: 'Texteffekter'
      body: 'Gnistor, glitch, neon med mera. Animerad text utan komplicerad grafikproduktion.'
    - title: 'Frilägg motiv'
      body: 'Separera motiv från bakgrund och lägg på olika filter. Sudda bakgrunden och behåll motivet skarpt med ett tryck.'
    - title: 'Egna filter med källkod'
      body: 'Varje filter visar sin shaderkod. Redigera själv, eller kopiera och be ChatGPT skapa något nytt.'
    - title: 'Communityfilter'
      body: 'Publicera egna filter, upptäck andras och lägg till dem i biblioteket med ett tryck.'
