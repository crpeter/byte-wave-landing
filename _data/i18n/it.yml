  features:
    title: 'Cosa include'
    items:
    - title: 'Verifica C2PA e provenienza video'
      body: 'Verifica le Content Credentials supportate in foto e video, comprese le etichette di generazione IA. Ogni salvataggio in Foto riceve inoltre un timbro ByteWave per rilevare modifiche successive.'
    - title: 'Rallentatore e sfocatura movimento'
      body: 'Rendi più fluido il rallentatore con la conversione del frame rate. Anche la sfocatura movimento e la riduzione del rumore temporale sono elaborate sul dispositivo.'
    - title: 'Aumento risoluzione con IA'
      body: 'Aumenta la risoluzione sul dispositivo, senza cloud e senza attendere un server.'
    - title: 'Tracce audio illimitate'
      body: 'Sovrapponi tutti i clip audio che vuoi sulla timeline. Effetti sonori inclusi, senza limiti di tracce.'
    - title: 'Sintesi vocale'
      body: 'Trasforma testo in voce o genera sottotitoli sul dispositivo. L''etichettatura automatica facoltativa dei video condivisi richiede account e consenso.'
    - title: 'Effetti di testo'
      body: 'Scintille, glitch, neon e altro. Testo animato senza creare grafiche in movimento complesse.'
    - title: 'Isolamento del soggetto'
      body: 'Separa i soggetti dagli sfondi e applica filtri diversi. Sfoca lo sfondo mantenendo il soggetto nitido con un tocco.'
    - title: 'Filtri personalizzati con codice'
      body: 'Ogni filtro mostra il codice shader. Modificalo direttamente, oppure copialo e chiedi a ChatGPT di crearne uno nuovo.'
    - title: 'Filtri della community'
      body: 'Pubblica i tuoi filtri, scopri quelli degli altri e aggiungili alla libreria con un tocco.'
