  features:
    title: Ce que vous obtenez
    items:
      - title: Vérification C2PA et provenance vidéo
        body: >-
          Vérifiez les Content Credentials compatibles de vos photos et vidéos,
          dont les mentions de génération par IA. Chaque exportation vers Photos
          reçoit aussi une empreinte ByteWave pour détecter les modifications ultérieures.
      - title: Ralenti et flou de mouvement
        body: >-
          Fluidifiez les ralentis avec la conversion de fréquence d’images.
          Le flou de mouvement et la réduction temporelle du bruit sont également
          calculés localement avant l’aperçu.
      - title: Amélioration de la résolution par IA
        body: >-
          Augmentez la résolution sur votre appareil. Aucun traitement dans le cloud,
          aucune attente d’un serveur.
      - title: Pistes audio illimitées
        body: >-
          Superposez autant de clips audio que nécessaire sur la timeline.
          Effets sonores intégrés, sans limite de pistes.
      - title: Synthèse vocale
        body: >-
          Écrivez du texte pour le transformer en voix ou générez des sous-titres
          sur votre appareil. L’identification automatique facultative des sujets
          aide à découvrir les vidéos partagées et nécessite un compte et un accord explicite.
      - title: Effets de texte
        body: >-
          Étincelles, glitch, néon et bien plus. Du texte animé sans devoir
          créer une composition d’animation.
      - title: Détourage du sujet
        body: >-
          Séparez le sujet de l’arrière-plan pour appliquer des filtres différents.
          Floutez le fond tout en gardant le sujet net, en un geste.
      - title: Filtres personnalisés avec code source
        body: >-
          Chaque filtre révèle son code shader. Modifiez-le directement,
          ou copiez-le et demandez à ChatGPT de créer un nouvel effet.
      - title: Filtres communautaires
        body: >-
          Publiez vos filtres et découvrez ceux des autres créateurs.
          Ajoutez-les à votre bibliothèque en un geste.
  filters:
    title: Des filtres que vous pouvez vraiment modifier
    desc: >-
      Contrairement aux éditeurs qui cachent le fonctionnement des filtres,
      ByteWave vous montre le code. Modifiez-le, apprenez avec lui,
      ou faites-le adapter par une IA avant de recoller le résultat.
    comment: // Arrière-plan impressionniste, sujet net
