  privacy:
    title: Vos vidéos restent sur votre appareil
    intro: >-
      Partez des moments que vous avez filmés. Coupez les plans, ajustez le son et choisissez
      vos effets. ByteWave effectue le montage et le rendu sur votre appareil Apple compatible.
    local: ByteWave traite le montage localement sur votre appareil Apple.
    sharing: >-
      Aucun compte n’est nécessaire pour monter en local. Vos vidéos ne sont pas envoyées
      en ligne, sauf si vous choisissez explicitement de les publier ou de les partager
      avec une fonction connectée.
    stamp: >-
      Chaque exportation vers Photos est signée de manière cryptographique avec des données
      de provenance ByteWave pour aider à vérifier son origine et d’éventuelles modifications.
      Cette signature ne prouve pas que les événements montrés ont eu lieu.
    stamp_link: Ce que prouvent réellement les exportations signées.
