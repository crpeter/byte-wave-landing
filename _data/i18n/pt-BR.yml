  features:
    title: 'O que está incluído'
    items:
    - title: 'Verificação C2PA e proveniência'
      body: 'Verifique as credenciais de conteúdo compatíveis em fotos e vídeos, incluindo identificações de geração por IA. Cada exportação para Fotos recebe um selo ByteWave para detectar alterações.'
    - title: 'Câmera lenta e desfoque de movimento'
      body: 'Deixe a câmera lenta mais fluida com a conversão de taxa de quadros. O desfoque de movimento e a redução de ruído também são processados no dispositivo.'
    - title: 'Aumento da resolução por IA'
      body: 'Aumente a resolução no dispositivo. Sem processamento na nuvem nem espera por servidores.'
    - title: 'Trilhas de áudio ilimitadas'
      body: 'Sobreponha quantos clipes de áudio quiser na linha do tempo. Efeitos sonoros incluídos, sem limite de trilhas.'
    - title: 'Texto para voz'
      body: 'Transforme texto em voz ou gere legendas no dispositivo. A identificação automática opcional de vídeos compartilhados exige conta e consentimento.'
    - title: 'Efeitos de texto'
      body: 'Brilhos, glitch, neon e muito mais. Texto animado sem precisar criar gráficos em movimento complexos.'
    - title: 'Isolamento do sujeito'
      body: 'Separe o sujeito do fundo e aplique filtros distintos. Desfoque o fundo e mantenha o sujeito nítido com um toque.'
    - title: 'Filtros personalizados com código-fonte'
      body: 'Cada filtro mostra o código do shader. Edite-o diretamente ou copie-o e peça ao ChatGPT para criar algo novo.'
    - title: 'Filtros da comunidade'
      body: 'Publique seus filtros, descubra filtros de outros criadores e adicione-os à biblioteca com um toque.'
  filters:
    title: 'Filtros que você pode realmente editar'
    desc: 'A maioria dos editores esconde o código dos filtros. O ByteWave mostra esse código. Você pode modificá-lo, aprender com ele ou pedir a uma IA para adaptá-lo e colar o resultado.'
    comment: '// Fundo impressionista, sujeito nítido'
