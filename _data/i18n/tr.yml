  features:
    title: 'Neler sunuyoruz'
    items:
    - title: 'C2PA kontrolü ve video kökeni'
      body: 'Fotoğraf ve videolarda yapay zekâ etiketleri dâhil desteklenen Content Credentials bilgilerini kontrol edin. Fotoğraflar''a kaydedilen videolar sonradan yapılan değişiklikleri belirlemeye yardımcı olan ByteWave damgası alır.'
    - title: 'Ağır çekim ve hareket bulanıklığı'
      body: 'Kare hızı dönüştürme ile ağır çekimi yumuşatın. Hareket bulanıklığı ve zamansal gürültü azaltma da cihazda işlenir.'
    - title: 'Yapay zekâ ile çözünürlük yükseltme'
      body: 'Çözünürlüğü cihazınızda yükseltin. Bulutta işleme ve sunucu bekleme süresi yok.'
    - title: 'Sınırsız ses kanalı'
      body: 'Zaman çizelgesine istediğiniz kadar ses klibi ekleyin. Ses efektleri dahil, kanal sınırı yok.'
    - title: 'Metinden konuşmaya'
      body: 'Metni sese dönüştürün veya cihazda altyazı oluşturun. Paylaşılan videolar için isteğe bağlı otomatik etiketleme hesap ve onay gerektirir.'
    - title: 'Metin efektleri'
      body: 'Işıltı, glitch, neon ve daha fazlası. Karmaşık hareketli grafikler olmadan animasyonlu metin.'
    - title: 'Nesne ayırma'
      body: 'Özne ile arka planı ayırıp farklı filtreler uygulayın. Tek dokunuşla arka planı bulanık, özneyi net tutun.'
    - title: 'Kaynak kodlu özel filtreler'
      body: 'Her filtre shader kodunu gösterir. Doğrudan düzenleyin veya kopyalayıp ChatGPT''den yenisini oluşturmasını isteyin.'
    - title: 'Topluluk filtreleri'
      body: 'Kendi filtrelerinizi yayınlayın, başkalarının filtrelerini keşfedin ve kütüphanenize ekleyin.'
  filters:
    title: 'Gerçekten düzenleyebileceğiniz filtreler'
    desc: 'Çoğu editör filtre kodunu gizler. ByteWave size gösterir. Değiştirin, öğrenin veya yapay zekâya uyarlatıp sonucu geri yapıştırın.'
    comment: '// Empresyonist arka plan, net özne'
