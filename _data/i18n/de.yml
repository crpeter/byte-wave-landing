  features:
    title: Das ist enthalten
    items:
      - title: C2PA-Prüfung und Videoherkunft
        body: >-
          Prüfe unterstützte Content Credentials von Fotos und Videos, einschließlich
          KI-Kennzeichnungen. Jeder Export in Fotos bekommt außerdem eine ByteWave-Signatur.
      - title: Zeitlupe und Bewegungsunschärfe
        body: >-
          Erzeuge flüssigere Zeitlupe durch Bildratenumwandlung.
          Bewegungsunschärfe und zeitliche Rauschreduzierung laufen lokal.
      - title: KI-Hochskalierung
        body: >-
          Verbessere die Auflösung direkt auf deinem Gerät, ohne Cloud oder Serverwarteschlange.
      - title: Unbegrenzte Audiospuren
        body: >-
          Lege beliebig viele Audioclips auf einer Timeline übereinander.
          Inklusive Soundeffekten und ohne Spurenlimit.
      - title: Text-zu-Sprache
        body: >-
          Wandle Text in Sprache um oder erstelle Untertitel auf dem Gerät.
          Optionale automatische Tags für geteilte Videos erfordern Konto und Zustimmung.
      - title: Texteffekte
        body: >-
          Funkeln, Glitch, Neon und mehr. Animierte Schrift ohne eigene Motion-Graphics-Komposition.
      - title: Motive freistellen
        body: >-
          Trenne Motiv und Hintergrund und verwende unterschiedliche Filter.
          Hintergrund weich, Motiv scharf – mit einem Fingertipp.
      - title: Eigene Filter mit Quellcode
        body: >-
          Jeder Filter zeigt seinen Shader-Code. Bearbeite ihn selbst oder kopiere ihn
          und bitte ChatGPT, etwas Neues daraus zu machen.
      - title: Community-Filter
        body: >-
          Veröffentliche eigene Filter, entdecke Kreationen anderer und füge sie deiner Bibliothek hinzu.
  filters:
    title: Filter, die du wirklich bearbeiten kannst
    desc: >-
      Andere Apps verstecken ihren Filtercode. ByteWave zeigt ihn dir.
      Ändere ihn, lerne daraus oder lass ihn von einer KI anpassen und füge das Ergebnis ein.
    comment: // Impressionistischer Hintergrund, scharfes Motiv
