  privacy:
    title: Deine Videos bleiben auf deinem Gerät
    intro: >-
      Starte mit selbst aufgenommenen Momenten. Schneide Clips, bearbeite den Ton
      und wähle deine Effekte. ByteWave verarbeitet Videos lokal auf unterstützten Apple-Geräten.
    local: Die Bearbeitung läuft lokal auf deinem Apple-Gerät.
    sharing: >-
      Für lokales Bearbeiten brauchst du kein Konto. Deine Videos werden
      nur hochgeladen, wenn du sie ausdrücklich über eine Onlinefunktion teilst oder veröffentlichst.
    stamp: >-
      Jeder Export in Fotos wird mit signierten ByteWave-Herkunftsdaten versehen.
      So lassen sich der Ursprung und mögliche spätere Änderungen prüfen.
      Eine Signatur beweist nicht, dass die gezeigte Szene passiert ist.
    stamp_link: Was signierte Exporte wirklich nachweisen.
