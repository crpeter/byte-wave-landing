  features:
    title: What you get
    items:
    - title: C2PA checks & video provenance
      body: Check photos and videos for supported Content Credentials, including AI-generation labels. Every Save
        to Photos export also gets a ByteWave stamp to help identify later changes.
    - title: Slow motion & motion blur
      body: Make slow-motion video smoother with FRC. Motion blur and temporal noise reduction are also processed
        locally on your device before preview.
    - title: AI upscaling
      body: Upscale resolution on-device. No cloud processing, no waiting for a server.
    - title: Unlimited audio tracks
      body: Layer as many audio clips as you need on a visual timeline. Built-in sound effects. No track limits.
    - title: Text to speech
      body: Type text for voice synthesis or generate captions on your device. Optional automatic tagging helps
        others discover shared videos and requires an account and opt-in.
    - title: Text effects
      body: Sparkle, glitch, neon, and more. Animated text that doesn't require a motion graphics background.
    - title: Subject isolation
      body: Separate subjects from backgrounds and apply filters to each independently. Blur the background, keep
        the subject sharp; one tap.
    - title: Custom filters with source code
      body: Every filter shows you the shader code behind it. Edit it directly, or copy the code and ask ChatGPT
        to make something new.
    - title: Community filters
      body: Publish filters you've made. Browse and grab filters from other creators. One tap to add to your library.
  filters:
    title: Filters you can actually edit
    desc: Most editors treat filters as a black box. ByteWave shows you the code. Change it, learn from it, or
      copy it and describe what you want to an AI; paste the result back in.
    comment: // Impressionist background, sharp subject
