  features:
    title: 'O que está incluído'
    items:
    - title: 'Verificação C2PA e proveniência'
      body: 'Verifique as credenciais de conteúdo compatíveis em fotografias e vídeos, incluindo identificações de geração por IA. Cada exportação para Fotografias recebe um selo ByteWave para detetar alterações.'
    - title: 'Câmara lenta e desfoque de movimento'
      body: 'Torne a câmara lenta mais fluida com a conversão da taxa de fotogramas. O desfoque de movimento e a redução de ruído também são processados no dispositivo.'
    - title: 'Aumento da resolução por IA'
      body: 'Aumente a resolução no dispositivo. Sem processamento na nuvem nem espera por servidores.'
    - title: 'Faixas de áudio ilimitadas'
      body: 'Sobreponha quantos clips de áudio quiser na cronologia. Efeitos sonoros incluídos, sem limite de faixas.'
    - title: 'Texto para voz'
      body: 'Converta texto em fala ou gere legendas no dispositivo. A identificação automática opcional de vídeos partilhados exige conta e consentimento.'
    - title: 'Efeitos de texto'
      body: 'Brilhos, glitch, néon e muito mais. Texto animado sem precisar de criar animações complexas.'
    - title: 'Isolamento do sujeito'
      body: 'Separe o sujeito do fundo e aplique filtros distintos. Desfoque o fundo e mantenha o sujeito nítido com um toque.'
    - title: 'Filtros personalizados com código-fonte'
      body: 'Cada filtro mostra o código shader. Edite-o ou copie-o e peça ao ChatGPT que crie algo novo.'
    - title: 'Filtros da comunidade'
      body: 'Publique os seus filtros, descubra filtros de outros criadores e adicione-os à biblioteca com um toque.'
  filters:
    title: 'Filtros que pode realmente editar'
    desc: 'A maioria dos editores esconde o código dos filtros. O ByteWave mostra-o. Altere, aprenda ou peça a uma IA que o adapte e cole o resultado.'
    comment: '// Fundo impressionista, sujeito nítido'
  cta:
