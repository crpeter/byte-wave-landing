      body: 'Muunna teksti puheeksi tai luo tekstityksiä laitteella. Jaettujen videoiden valinnaiset automaattiset tunnisteet vaativat tilin ja suostumuksen.'
    - title: 'Tekstitehosteet'
      body: 'Kipinät, glitch, neon ja muuta. Animoi teksti ilman erillisiä liikegrafiikoita.'
    - title: 'Kohteen erottelu'
      body: 'Erottele kohde taustasta ja käytä eri suodattimia. Sumennettu tausta ja terävä kohde yhdellä napautuksella.'
    - title: 'Omat suodattimet lähdekoodilla'
      body: 'Jokaisen suodattimen varjostinkoodi on näkyvissä. Muokkaa sitä tai pyydä ChatGPT:tä luomaan jotain uutta.'
    - title: 'Yhteisösuodattimet'
      body: 'Julkaise omat suodattimesi, selaa muiden tekemiä ja lisää ne kirjastoon yhdellä napautuksella.'
