      body: 'Paranna tarkkuutta omalla laitteella. Ei pilvikäsittelyä tai palvelinjonoa.'
    - title: 'Rajattomat ääniraidat'
      body: 'Lisää aikajanalle niin monta äänileikettä kuin tarvitset. Äänitehosteet mukana. Ei raitarajaa.'
