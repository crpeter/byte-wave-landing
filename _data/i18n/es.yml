  features:
    title: Qué incluye ByteWave
    items:
    - title: Credenciales C2PA y procedencia del video
      body: Busca credenciales de contenido compatibles en fotos y videos, incluidas las etiquetas de generación
        con IA. Al guardar en Fotos, el sello de ByteWave permite comprobar si el archivo cambia después.
    - title: Cámara lenta y desenfoque de movimiento
      body: Suaviza la cámara lenta con la conversión de fotogramas. El desenfoque de movimiento y la reducción
        de ruido temporal también se procesan en tu dispositivo antes de la vista previa.
    - title: Aumento de resolución con IA
      body: Aumenta la resolución en tu dispositivo. Sin procesamiento en la nube ni esperas por un servidor.
    - title: Pistas de audio ilimitadas
      body: Combina tantos clips de audio como necesites en la línea de tiempo. Incluye efectos de sonido y no
        hay límite de pistas.
    - title: Texto a voz
      body: 'Escribe un texto para convertirlo en voz o genera subtítulos en tu dispositivo. El etiquetado automático
        ayuda a otras personas a descubrir los videos que compartes. Es opcional: requiere una cuenta y que lo
        actives.'
    - title: Efectos de texto
      body: Destellos, interferencias, neón y más. Anima el texto aunque no tengas experiencia en animación.
    - title: Aislamiento del sujeto
      body: Separa el sujeto del fondo para aplicarles filtros distintos. Con un toque puedes desenfocar el fondo
        y mantener el sujeto nítido.
    - title: Filtros con código editable
      body: Cada filtro te muestra el código del shader. Edítalo directamente o cópialo y pídele a ChatGPT que
        cree algo nuevo.
    - title: Filtros de la comunidad
      body: Publica tus filtros y prueba los de otros creadores. Añádelos a tu biblioteca con un toque.
  filters:
    title: Filtros que puedes modificar
    desc: Muchos editores ocultan cómo funciona cada filtro. ByteWave te muestra el código. Puedes modificarlo,
      aprender de él o copiarlo, pedirle un cambio a una IA y pegar el resultado.
    comment: // Fondo impresionista, sujeto nítido
  cta:
    desc: Edita sin conexión y sin cuenta. Solo subes el video si decides publicarlo.
    apple: Descargar para dispositivos Apple
