    "captionsLabel": "Automatic captions:",
    "captionsP": "Caption transcription runs on your device, without an account. Your audio is not sent to ByteWave or Apple servers for caption transcription. A speech or language model may need to be downloaded before offline use.",
    "feedHeading": "The public video feed",
    "feedP1": "ByteWave includes a public video feed that any user can browse. We do not log watch history or track feed browsing behavior for any user, whether signed in or anonymous.",
    "feedP2": "Feed recommendations and liked video history are computed and stored entirely on your device using local storage. This local history is separate from the account information and content you deliberately provide through online features.",
    "socialHeading": "Social features (optional)",
    "socialP1": "Creating a profile is entirely optional. If you create an account, we collect the account information needed to authenticate you, including your email address, using Google Firebase Authentication.",
