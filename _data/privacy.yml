    "taggingP": "This optional feature combines speech recognition with visual analysis to help describe videos you choose to share. It requires an account and explicit opt-in, after an explanation of how it works.",
    "speechP": "Speech transcription for automatic tagging runs on your device after you grant speech recognition permission. Audio is not sent to Apple or ByteWave servers for transcription. If on-device speech recognition is unavailable, the speech step is skipped rather than sent to a server.",
    "thirdHeading": "Third parties",
    "thirdP": "We do not sell personal data or share personal data for targeted advertising. We use service providers, including Google Firebase, to provide account authentication and backend functionality. We do not use third-party analytics, advertising SDKs, or behavioral tracking.",
    "contactHeading": "Contact",
    "contactP": "If you have questions about this policy, contact us at",
    "cta": "Edit locally without creating an account.",
    "download": "Download for Apple"
